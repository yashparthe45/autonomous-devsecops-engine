apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-upi-app
  namespace: devsecops
  labels:
    app: dummy-upi-app
    app.kubernetes.io/name: dummy-upi-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: autonomous-devsecops-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dummy-upi-app
  template:
    metadata:
      labels:
        app: dummy-upi-app
        app.kubernetes.io/name: dummy-upi-app
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: autonomous-devsecops-engine
    spec:
      containers:
        - name: dummy-upi-app
          image: 285364193286.dkr.ecr.us-east-1.amazonaws.com/dummy-upi-app:57
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"